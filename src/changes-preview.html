<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Changed Files</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
      padding: 20px;
      user-select: none;
    }
    
    .container {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      margin: 0 auto;
    }
    
    h2 {
      font-size: 18px;
      margin-bottom: 16px;
      color: #24292e;
    }
    
    .file-list {
      list-style: none;
    }
    
    .file-item {
      padding: 8px 12px;
      margin: 4px 0;
      background: #f6f8fa;
      border-radius: 6px;
      font-size: 13px;
      font-family: 'SF Mono', Monaco, 'Courier New', monospace;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .file-status {
      font-weight: 600;
      width: 20px;
      text-align: center;
    }
    
    .status-modified {
      color: #f0ad4e;
    }
    
    .status-added {
      color: #28a745;
    }
    
    .status-deleted {
      color: #dc3545;
    }
    
    .status-renamed {
      color: #17a2b8;
    }
    
    .file-path {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .summary {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e1e4e8;
      font-size: 12px;
      color: #586069;
    }
    
    .loading {
      text-align: center;
      color: #586069;
    }
    
    .close-hint {
      text-align: center;
      margin-top: 16px;
      font-size: 11px;
      color: #959da5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Changed Files</h2>
    <div id="content">
      <div class="loading">Loading...</div>
    </div>
    <div class="close-hint">Press Esc to close</div>
  </div>
  
  <script>
    // Listen for file changes data
    window.electronAPI.onFileChanges((data) => {
      const content = document.getElementById('content');
      
      if (!data || !data.files || data.files.length === 0) {
        content.innerHTML = '<div class="loading">No changes</div>';
        return;
      }
      
      let html = '<ul class="file-list">';
      
      data.files.forEach(file => {
        const statusSymbol = getStatusSymbol(file);
        const statusClass = getStatusClass(file);
        
        html += `
          <li class="file-item">
            <span class="file-status ${statusClass}">${statusSymbol}</span>
            <span class="file-path">${file.path}</span>
          </li>
        `;
      });
      
      html += '</ul>';
      
      // Add summary
      const counts = {
        modified: data.modified || 0,
        created: data.created || 0,
        deleted: data.deleted || 0,
        renamed: data.renamed || 0
      };
      
      const summaryParts = [];
      if (counts.modified > 0) summaryParts.push(`${counts.modified} modified`);
      if (counts.created > 0) summaryParts.push(`${counts.created} added`);
      if (counts.deleted > 0) summaryParts.push(`${counts.deleted} deleted`);
      if (counts.renamed > 0) summaryParts.push(`${counts.renamed} renamed`);
      
      if (summaryParts.length > 0) {
        html += `<div class="summary">${summaryParts.join(', ')}</div>`;
      }
      
      content.innerHTML = html;
    });
    
    function getStatusSymbol(file) {
      if (file.index === 'A' || file.working_dir === 'A') return '+';
      if (file.index === 'D' || file.working_dir === 'D') return '-';
      if (file.index === 'R' || file.working_dir === 'R') return '→';
      return 'M';
    }
    
    function getStatusClass(file) {
      if (file.index === 'A' || file.working_dir === 'A') return 'status-added';
      if (file.index === 'D' || file.working_dir === 'D') return 'status-deleted';
      if (file.index === 'R' || file.working_dir === 'R') return 'status-renamed';
      return 'status-modified';
    }
    
    // Close on Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        window.close();
      }
    });
  </script>
</body>
</html>
