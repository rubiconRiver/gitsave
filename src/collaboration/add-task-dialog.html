<div class="modal" id="add-task-modal">
  <div class="modal-content">
    <div class="modal-header">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      Create New Task
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="task-title">Task Title</label>
        <input type="text" id="task-title" class="form-input" placeholder="What needs to be done?" autofocus>
      </div>
      <div class="form-group">
        <label for="task-priority">Priority</label>
        <select id="task-priority" class="form-input">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeAddTaskDialog()">Cancel</button>
      <button class="modal-btn modal-btn-primary" onclick="createTask()">Create Task</button>
    </div>
  </div>
</div>
