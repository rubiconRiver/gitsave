<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Git Graph - GitSave</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      overflow: hidden;
    }
    
    #canvas {
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }
    
    #canvas:active {
      cursor: grabbing;
    }
    
    .controls {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 15px;
      z-index: 100;
    }
    
    .zoom-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    
    .zoom-btn {
      width: 30px;
      height: 30px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      color: #c9d1d9;
      cursor: pointer;
      font-size: 18px;
    }
    
    .zoom-btn:hover {
      background: #30363d;
    }
    
    .info-panel {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 15px;
      max-width: 400px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    
    .info-panel.visible {
      opacity: 1;
    }
    
    .info-title {
      font-weight: 600;
      margin-bottom: 10px;
      color: #58a6ff;
      font-size: 14px;
    }
    
    .info-row {
      font-size: 12px;
      margin: 5px 0;
      display: flex;
      gap: 10px;
    }
    
    .info-label {
      color: #8b949e;
      min-width: 60px;
    }
    
    .info-value {
      color: #c9d1d9;
      word-break: break-all;
    }
    
    .commit-hash {
      font-family: monospace;
      font-size: 11px;
      color: #58a6ff;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  
  <div class="controls">
    <div class="zoom-controls">
      <button class="zoom-btn" onclick="zoomIn()">+</button>
      <button class="zoom-btn" onclick="zoomOut()">-</button>
      <button class="zoom-btn" onclick="resetView()">⟲</button>
    </div>
    <div style="font-size: 12px; color: #8b949e;">
      Drag to pan • Scroll to zoom
    </div>
  </div>
  
  <div class="info-panel" id="infoPanel">
    <div class="info-title" id="infoTitle"></div>
    <div id="infoContent"></div>
  </div>
  
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const infoPanel = document.getElementById('infoPanel');
    const infoTitle = document.getElementById('infoTitle');
    const infoContent = document.getElementById('infoContent');
    
    // Load git history
    const fs = require('fs');
    const path = require('path');
    let gitData = null;
    
    try {
      const dataPath = path.join(__dirname, '..', 'intentional.dev', 'git-history.json');
      gitData = JSON.parse(fs.readFileSync(dataPath, 'utf8'));
    } catch (error) {
      console.error('Failed to load git history:', error);
    }
    
    // Canvas setup
    let scale = 1;
    let offsetX = 100;
    let offsetY = 0;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    
    // Layout constants
    const COMMIT_SPACING = 120;
    const COMMIT_RADIUS = 6;
    const MAIN_Y = 300;
    
    // Hover state
    let hoveredCommit = null;
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      offsetY = canvas.height / 2;
      render();
    }
    
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      ctx.save();
      ctx.translate(offsetX, offsetY);
      ctx.scale(scale, scale);
      
      // Draw main branch
      const mainBranch = gitData.branches.find(b => b.name === 'main');
      if (!mainBranch) return;
      
      // Branch line
      ctx.strokeStyle = '#30363d';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-50, 0);
      ctx.lineTo(mainBranch.commits.length * COMMIT_SPACING + 50, 0);
      ctx.stroke();
      
      // Branch label
      ctx.fillStyle = '#8b949e';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('main', -40, -20);
      
      // Draw commits
      mainBranch.commits.forEach((commit, index) => {
        const x = index * COMMIT_SPACING;
        const y = 0;
        
        // Check hover
        const mouseX = (mousePos.x - offsetX) / scale;
        const mouseY = (mousePos.y - offsetY) / scale;
        const dist = Math.sqrt(Math.pow(mouseX - x, 2) + Math.pow(mouseY - y, 2));
        const isHovered = dist < COMMIT_RADIUS + 5;
        
        // Commit circle
        ctx.fillStyle = gitData.users[commit.author].color;
        ctx.beginPath();
        ctx.arc(x, y, COMMIT_RADIUS, 0, Math.PI * 2);
        ctx.fill();
        
        // Commit outline
        ctx.strokeStyle = isHovered ? '#ffffff' : gitData.users[commit.author].color;
        ctx.lineWidth = isHovered ? 3 : 2;
        ctx.beginPath();
        ctx.arc(x, y, COMMIT_RADIUS + 2, 0, Math.PI * 2);
        ctx.stroke();
        
        // Commit message preview (first line, truncated)
        ctx.fillStyle = '#8b949e';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        const message = commit.message.split('\n')[0];
        const truncated = message.length > 20 ? message.substr(0, 20) + '...' : message;
        ctx.fillText(truncated, x, y + 25);
        
        // Hash (first 7 chars)
        ctx.fillStyle = '#58a6ff';
        ctx.font = '10px monospace';
        ctx.fillText(commit.hash.substr(0, 7), x, y + 40);
        
        // Time
        const date = new Date(commit.time);
        const timeStr = date.toLocaleDateString('en-US', { 
          month: 'short', 
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
        ctx.fillStyle = '#666';
        ctx.font = '10px sans-serif';
        ctx.fillText(timeStr, x, y + 55);
        
        if (isHovered) {
          hoveredCommit = commit;
          showCommitInfo(commit);
        }
      });
      
      // Draw connections between commits
      ctx.strokeStyle = '#30363d';
      ctx.lineWidth = 2;
      for (let i = 1; i < mainBranch.commits.length; i++) {
        ctx.beginPath();
        ctx.moveTo((i - 1) * COMMIT_SPACING + COMMIT_RADIUS, 0);
        ctx.lineTo(i * COMMIT_SPACING - COMMIT_RADIUS, 0);
        ctx.stroke();
      }
      
      ctx.restore();
    }
    
    // Mouse handling
    let mousePos = { x: 0, y: 0 };
    
    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      dragStartX = e.clientX - offsetX;
      dragStartY = e.clientY - offsetY;
    });
    
    canvas.addEventListener('mousemove', (e) => {
      mousePos = { x: e.clientX, y: e.clientY };
      
      if (isDragging) {
        offsetX = e.clientX - dragStartX;
        offsetY = e.clientY - dragStartY;
      }
      
      render();
    });
    
    canvas.addEventListener('mouseup', () => {
      isDragging = false;
    });
    
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.9 : 1.1;
      
      // Zoom towards mouse position
      const mouseX = e.clientX;
      const mouseY = e.clientY;
      
      // Calculate the position under the mouse before zoom
      const beforeX = (mouseX - offsetX) / scale;
      const beforeY = (mouseY - offsetY) / scale;
      
      // Apply zoom
      scale *= delta;
      scale = Math.max(0.3, Math.min(scale, 3));
      
      // Calculate the position under the mouse after zoom
      const afterX = (mouseX - offsetX) / scale;
      const afterY = (mouseY - offsetY) / scale;
      
      // Adjust offset to keep the same point under the mouse
      offsetX += (afterX - beforeX) * scale;
      offsetY += (afterY - beforeY) * scale;
      
      render();
    });
    
    // Commit info panel
    function showCommitInfo(commit) {
      const author = gitData.users[commit.author];
      infoTitle.textContent = 'Commit Details';
      infoContent.innerHTML = `
        <div class="info-row">
          <span class="info-label">Hash:</span>
          <span class="info-value commit-hash">${commit.hash}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Author:</span>
          <span class="info-value">${author.name} &lt;${author.email}&gt;</span>
        </div>
        <div class="info-row">
          <span class="info-label">Date:</span>
          <span class="info-value">${new Date(commit.time).toLocaleString()}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Message:</span>
          <span class="info-value">${commit.message}</span>
        </div>
      `;
      infoPanel.classList.add('visible');
    }
    
    canvas.addEventListener('mouseleave', () => {
      infoPanel.classList.remove('visible');
      hoveredCommit = null;
    });
    
    // Controls
    function zoomIn() {
      scale *= 1.2;
      scale = Math.min(scale, 3);
      render();
    }
    
    function zoomOut() {
      scale *= 0.8;
      scale = Math.max(scale, 0.3);
      render();
    }
    
    function resetView() {
      scale = 1;
      offsetX = 100;
      offsetY = canvas.height / 2;
      render();
    }
  </script>
</body>
</html>
