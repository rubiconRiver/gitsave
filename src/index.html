<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Intentional</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    :root {
      /* Dark theme colors */
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --border-primary: #30363d;
      --border-secondary: #21262d;
      --text-primary: #c9d1d9;
      --text-secondary: #8b949e;
      --text-tertiary: #6e7681;
      --accent-primary: #58a6ff;
      --accent-success: #3fb950;
      --accent-warning: #d29922;
      --accent-danger: #f85149;
      --button-primary: #238636;
      --button-primary-hover: #2ea043;
      --button-secondary: #21262d;
      --button-secondary-hover: #30363d;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      padding: 0;
      user-select: none;
      margin: 0;
      height: 500px;
      overflow: hidden;
    }
    
    .container {
      background: var(--bg-secondary);
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    
    /* Subtle gradient overlay */
    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 100px;
      background: linear-gradient(to bottom, rgba(88, 166, 255, 0.05), transparent);
      pointer-events: none;
    }
    
    .header {
      padding: 24px 24px 20px;
      border-bottom: 1px solid var(--border-primary);
      background: var(--bg-primary);
      position: relative;
      z-index: 10;
    }
    
    .project-info {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    
    .project-name {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }
    
    .branch-name {
      font-size: 13px;
      color: var(--accent-primary);
      background: rgba(88, 166, 255, 0.15);
      padding: 4px 12px;
      border-radius: 16px;
      font-weight: 500;
      border: 1px solid rgba(88, 166, 255, 0.3);
    }
    
    .branch-owner {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
      display: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    
    .branch-owner.show {
      display: block;
      opacity: 1;
    }
    
    .branch-owner.not-mine {
      color: var(--accent-warning);
      font-weight: 500;
    }
    
    .claim-link {
      color: var(--accent-primary);
      cursor: pointer;
      font-size: 11px;
      text-decoration: underline;
      margin-left: 8px;
      transition: color 0.2s ease;
    }
    
    .claim-link:hover {
      color: var(--accent-primary);
      opacity: 0.8;
    }
    
    .status {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .status.clickable {
      cursor: pointer;
      transition: color 0.2s ease;
    }
    
    .status.clickable:hover {
      color: var(--accent-primary);
    }
    
    .status::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-tertiary);
      display: inline-block;
    }
    
    .status.has-changes::before {
      background: var(--accent-warning);
      box-shadow: 0 0 0 2px rgba(210, 153, 34, 0.2);
    }
    
    .main-action {
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .save-button {
      width: 100%;
      padding: 16px 24px;
      font-size: 16px;
      font-weight: 600;
      background: var(--button-primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
      letter-spacing: -0.2px;
    }
    
    .save-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.1), transparent);
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    
    .save-button:hover {
      background: var(--button-primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(35, 134, 54, 0.4);
    }
    
    .save-button:hover::before {
      opacity: 1;
    }
    
    .save-button:active {
      transform: scale(0.98) translateY(0);
      box-shadow: 0 2px 8px rgba(35, 134, 54, 0.3);
    }
    
    .save-button:disabled {
      background: var(--button-secondary);
      cursor: not-allowed;
      box-shadow: none;
      opacity: 0.6;
    }
    
    /* Subtle pulse animation when changes are detected */
    .save-button:not(:disabled) {
      animation: subtlePulse 2s ease-in-out infinite;
    }
    
    @keyframes subtlePulse {
      0%, 100% {
        box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
      }
      50% {
        box-shadow: 0 4px 20px rgba(35, 134, 54, 0.5);
      }
    }
    
    .save-button.not-my-branch {
      background: var(--accent-warning);
      box-shadow: 0 4px 12px rgba(210, 153, 34, 0.3);
    }
    
    .save-button.not-my-branch:hover {
      background: #b07c0a;
      box-shadow: 0 6px 20px rgba(210, 153, 34, 0.4);
    }
    
    .message-input {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-primary);
      border-radius: 8px;
      font-size: 14px;
      resize: vertical;
      min-height: 80px;
      color: var(--text-primary);
      transition: all 0.2s ease;
      font-family: inherit;
    }
    
    .message-input::placeholder {
      color: var(--text-tertiary);
    }
    
    .message-input:focus {
      outline: none;
      border-color: var(--accent-primary);
      background: var(--bg-primary);
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
    }
    
    .actions {
      display: flex;
      gap: 12px;
      padding: 0 24px 24px;
    }
    
    .action-button {
      flex: 1;
      padding: 10px 16px;
      background: var(--button-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    
    .action-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.05), transparent);
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    
    .action-button:hover {
      background: var(--button-secondary-hover);
      border-color: var(--border-secondary);
      transform: translateY(-1px);
    }
    
    .action-button:hover::before {
      opacity: 1;
    }
    
    .action-button:active {
      transform: translateY(0);
    }
    
    .action-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }
    
    .footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border-primary);
      background: var(--bg-primary);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 16px;
    }
    
    .footer-button {
      padding: 8px 12px;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-secondary);
      text-align: left;
      transition: all 0.2s ease;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .footer-button:hover {
      background: var(--button-secondary);
      color: var(--text-primary);
    }
    
    .footer-button:active {
      background: var(--button-secondary-hover);
    }
    
    .loading {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #333;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 5px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .error {
      color: var(--accent-danger);
      font-size: 13px;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .success {
      color: var(--accent-success);
      font-size: 13px;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .warning {
      color: var(--accent-warning);
      font-size: 13px;
      margin-top: 8px;
      padding: 12px 16px;
      background: rgba(210, 153, 34, 0.1);
      border: 1px solid rgba(210, 153, 34, 0.3);
      border-radius: 8px;
    }
    
    .error-with-guidance {
      margin-top: 12px;
      padding: 16px;
      background: rgba(248, 81, 73, 0.1);
      border: 1px solid rgba(248, 81, 73, 0.3);
      border-radius: 8px;
    }
    
    .error-message {
      color: var(--accent-danger);
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }
    
    .error-guidance {
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    
    /* Branch ownership modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    
    .modal.show {
      display: flex;
      animation: fadeIn 0.2s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .modal-content {
      background: var(--bg-secondary);
      border-radius: 12px;
      padding: 24px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-primary);
      animation: slideIn 0.3s ease;
    }
    
    @keyframes slideIn {
      from { 
        opacity: 0;
        transform: translateY(20px);
      }
      to { 
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .modal-header {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--accent-warning);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .modal-body {
      margin-bottom: 24px;
      line-height: 1.6;
      color: var(--text-primary);
      font-size: 14px;
    }
    
    .modal-branch-info {
      background: var(--bg-tertiary);
      padding: 12px 16px;
      border-radius: 8px;
      margin: 16px 0;
      font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
      font-size: 13px;
      color: var(--accent-primary);
      border: 1px solid var(--border-primary);
    }
    
    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }
    
    .modal-btn {
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border-primary);
      background: var(--button-secondary);
      color: var(--text-primary);
      transition: all 0.2s ease;
    }
    
    .modal-btn:hover {
      background: var(--button-secondary-hover);
      transform: translateY(-1px);
    }
    
    .modal-btn:active {
      transform: translateY(0);
    }
    
    .modal-btn-primary {
      background: var(--accent-warning);
      color: var(--bg-primary);
      border-color: var(--accent-warning);
    }
    
    .modal-btn-primary:hover {
      background: #b07c0a;
      border-color: #b07c0a;
    }
    
    .modal-btn-secondary {
      background: var(--accent-primary);
      color: white;
      border-color: var(--accent-primary);
    }
    
    .modal-btn-secondary:hover {
      background: #4c8dd6;
      border-color: #4c8dd6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="project-info">
        <span class="project-name" id="projectName">No Project</span>
        <span class="branch-name" id="branchName">main</span>
      </div>
      <div class="branch-owner" id="branchOwner"></div>
      <div class="status" id="status">Ready</div>
    </div>
    
    <div class="main-action">
      <button class="save-button" id="saveButton">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: middle; margin-right: 8px;">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        Save Changes
      </button>
      <textarea 
        class="message-input" 
        id="messageInput" 
        placeholder="Commit message (optional, defaults to 'WIP')"
      ></textarea>
      <div id="feedback"></div>
    </div>
    
    <div class="actions">
      <button class="action-button" id="syncButton">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: middle; margin-right: 6px;">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        Sync
      </button>
      <button class="action-button" id="pushButton">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: middle; margin-right: 6px;">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
        Push
      </button>
      <button class="action-button" id="branchButton">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: middle; margin-right: 6px;">
          <line x1="6" y1="3" x2="6" y2="15"></line>
          <circle cx="18" cy="6" r="3"></circle>
          <circle cx="6" cy="18" r="3"></circle>
          <path d="M18 9a9 9 0 0 1-9 9"></path>
        </svg>
        Branches
      </button>
    </div>
    
    <div class="footer">
      <button class="footer-button" id="selectRepoButton">Change Project</button>
      <button class="footer-button" id="openFolderButton">Open in Finder</button>
      <button class="footer-button" id="openGithubButton">View on GitHub</button>
      <button class="footer-button" id="quitButton">Quit Intentional</button>
    </div>
  </div>
  
  <!-- Branch ownership modal -->
  <div id="branchOwnershipModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">⚠️ This isn't your branch</div>
      <div class="modal-body">
        <div id="ownershipMessage"></div>
        <div class="modal-branch-info" id="branchInfo"></div>
        <p>Would you like to:</p>
      </div>
      <div class="modal-actions">
        <button class="modal-btn" id="cancelSaveBtn">Cancel</button>
        <button class="modal-btn modal-btn-secondary" id="createMyBranchBtn">Create My Branch</button>
        <button class="modal-btn modal-btn-primary" id="saveAnywayBtn">Save Anyway</button>
      </div>
    </div>
  </div>
  
  <script src="renderer.js"></script>
</body>
</html>
