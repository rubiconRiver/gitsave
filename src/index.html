<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Intentional</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
      padding: 20px;
      user-select: none;
    }
    
    .container {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    
    .header {
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #e1e4e8;
    }
    
    .project-info {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 5px;
    }
    
    .project-name {
      font-size: 18px;
      font-weight: 600;
    }
    
    .branch-name {
      font-size: 14px;
      color: #666;
      background: #f0f0f0;
      padding: 2px 8px;
      border-radius: 12px;
    }
    
    .status {
      font-size: 12px;
      color: #666;
    }
    
    .main-action {
      margin: 20px 0;
    }
    
    .save-button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: 600;
      background: #2ea44f;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .save-button:hover {
      background: #2c974b;
    }
    
    .save-button:active {
      transform: scale(0.98);
    }
    
    .save-button:disabled {
      background: #94d3a2;
      cursor: not-allowed;
    }
    
    .message-input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #d1d5da;
      border-radius: 6px;
      font-size: 14px;
      resize: vertical;
      min-height: 50px;
    }
    
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    
    .action-button {
      flex: 1;
      padding: 10px;
      background: #f6f8fa;
      border: 1px solid #d1d5da;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    
    .action-button:hover {
      background: #e1e4e8;
    }
    
    .action-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .footer {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e1e4e8;
    }
    
    .footer-button {
      width: 100%;
      padding: 8px;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: #0366d6;
      text-align: left;
    }
    
    .footer-button:hover {
      text-decoration: underline;
    }
    
    .loading {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #333;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 5px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .error {
      color: #d73a49;
      font-size: 12px;
      margin-top: 5px;
    }
    
    .success {
      color: #28a745;
      font-size: 12px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="project-info">
        <span class="project-name" id="projectName">No Project</span>
        <span class="branch-name" id="branchName">main</span>
      </div>
      <div class="status" id="status">Ready</div>
    </div>
    
    <div class="main-action">
      <button class="save-button" id="saveButton">
        💾 Save Changes
      </button>
      <textarea 
        class="message-input" 
        id="messageInput" 
        placeholder="Commit message (optional, defaults to 'WIP')"
      ></textarea>
      <div id="feedback"></div>
    </div>
    
    <div class="actions">
      <button class="action-button" id="syncButton">🔄 Sync</button>
      <button class="action-button" id="pushButton">📤 Push</button>
      <button class="action-button" id="branchButton">🌿 Branch</button>
    </div>
    
    <div class="footer">
      <button class="footer-button" id="selectRepoButton">Change Project</button>
      <button class="footer-button" id="quitButton">Quit GitSave</button>
    </div>
  </div>
  
  <script src="renderer.js"></script>
</body>
</html>
