<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>GitSave - License Activation</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px;
      background: #f5f5f5;
      text-align: center;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      background: #007AFF;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background: #0056b3;
    }
    .secondary {
      background: #666;
    }
    .secondary:hover {
      background: #555;
    }
    .error {
      color: #d32f2f;
      margin-top: 10px;
    }
    .success {
      color: #388e3c;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Activate GitSave</h1>
  <div class="form-group">
    <input type="email" id="email" placeholder="Email address" required>
  </div>
  <div class="form-group">
    <input type="text" id="licenseKey" placeholder="License key" required>
  </div>
  <button id="activateBtn">Activate</button>
  <button class="secondary" id="buyBtn">Buy License</button>
  <div id="feedback"></div>

  <script src="license-renderer.js"></script>
</body>
</html>
