<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Branch Graph - GitSave</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      overflow: hidden;
    }
    
    #canvas {
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }
    
    #canvas:active {
      cursor: grabbing;
    }
    
    .controls {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 15px;
      z-index: 100;
    }
    
    .zoom-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    
    .zoom-btn {
      width: 30px;
      height: 30px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      color: #c9d1d9;
      cursor: pointer;
      font-size: 18px;
    }
    
    .zoom-btn:hover {
      background: #30363d;
    }
    
    .info-panel {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 15px;
      max-width: 300px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    
    .info-panel.visible {
      opacity: 1;
    }
    
    .info-title {
      font-weight: 600;
      margin-bottom: 10px;
      color: #58a6ff;
    }
    
    .info-row {
      font-size: 12px;
      margin: 5px 0;
      display: flex;
      justify-content: space-between;
    }
    
    .info-label {
      color: #8b949e;
    }
    
    .info-value {
      color: #c9d1d9;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  
  <div class="controls">
    <div class="zoom-controls">
      <button class="zoom-btn" onclick="zoomIn()">+</button>
      <button class="zoom-btn" onclick="zoomOut()">-</button>
      <button class="zoom-btn" onclick="resetView()">⟲</button>
    </div>
    <div style="font-size: 12px; color: #8b949e;">
      Drag to pan • Scroll to zoom
    </div>
  </div>
  
  <div class="info-panel" id="infoPanel">
    <div class="info-title" id="infoTitle"></div>
    <div id="infoContent"></div>
  </div>
  
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const infoPanel = document.getElementById('infoPanel');
    const infoTitle = document.getElementById('infoTitle');
    const infoContent = document.getElementById('infoContent');
    
    // Load branch data
    const fs = require('fs');
    const path = require('path');
    let branchData = null;
    
    try {
      const dataPath = path.join(__dirname, '..', 'intentional.dev', 'branch-history.json');
      branchData = JSON.parse(fs.readFileSync(dataPath, 'utf8'));
    } catch (error) {
      console.error('Failed to load branch data:', error);
    }
    
    // Canvas setup
    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    
    // Branch layout
    const BRANCH_HEIGHT = 80;
    const COMMIT_SPACING = 60;
    const MAIN_Y = 400;
    
    // Branch positions and commit data
    const branches = {};
    const commits = [];
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      render();
    }
    
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    
    // Build branch layout
    function buildBranchLayout() {
      // Main branch
      branches['main'] = {
        y: MAIN_Y,
        commits: generateCommits(branchData.branches.find(b => b.name === 'main'), 0),
        color: '#8b949e',
        angle: 0
      };
      
      // Feature branches
      let branchIndex = 0;
      branchData.branches.forEach(branch => {
        if (branch.name === 'main') return;
        
        const user = branch.owner ? branchData.users[branch.owner] : null;
        const angle = (branchIndex % 2 === 0 ? 1 : -1) * (15 + (branchIndex % 4) * 10);
        const startX = 200 + (branchIndex * 150);
        
        branches[branch.name] = {
          y: MAIN_Y - (Math.sin(angle * Math.PI / 180) * 200),
          startX: startX,
          commits: generateCommits(branch, startX),
          color: user ? user.color : '#58a6ff',
          angle: angle,
          parent: branch.parent || 'main',
          mergePoint: branch.status === 'stale' ? null : startX + (branch.commitCount * 2)
        };
        
        branchIndex++;
      });
    }
    
    function generateCommits(branch, startX) {
      const commits = [];
      const commitCount = Math.min(branch.commitCount, 20); // Limit for visualization
      
      for (let i = 0; i < commitCount; i++) {
        commits.push({
          x: startX + (i * COMMIT_SPACING),
          branch: branch.name,
          message: i === commitCount - 1 ? branch.lastCommit.message : `Commit ${i + 1}`,
          author: branch.lastCommit.author,
          size: i === commitCount - 1 ? 8 : 4
        });
      }
      
      return commits;
    }
    
    buildBranchLayout();
    
    // Rendering
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      ctx.save();
      ctx.translate(offsetX, offsetY);
      ctx.scale(scale, scale);
      
      // Draw main branch line
      ctx.strokeStyle = '#30363d';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, MAIN_Y);
      ctx.lineTo(2000, MAIN_Y);
      ctx.stroke();
      
      // Draw feature branches
      Object.entries(branches).forEach(([branchName, branch]) => {
        if (branchName === 'main') return;
        
        ctx.strokeStyle = branch.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        
        // Branch line
        const parentBranch = branches[branch.parent];
        ctx.moveTo(branch.startX, parentBranch.y);
        
        // Curve to branch position
        const cp1x = branch.startX + 50;
        const cp1y = parentBranch.y;
        const cp2x = branch.startX + 100;
        const cp2y = branch.y;
        
        ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, branch.startX + 150, branch.y);
        ctx.lineTo(branch.startX + (branch.commits.length * COMMIT_SPACING), branch.y);
        
        // Merge back line (if applicable)
        if (branch.mergePoint) {
          ctx.bezierCurveTo(
            branch.mergePoint - 50, branch.y,
            branch.mergePoint - 100, parentBranch.y,
            branch.mergePoint, parentBranch.y
          );
        }
        
        ctx.stroke();
        
        // Branch name
        ctx.fillStyle = branch.color;
        ctx.font = '14px sans-serif';
        ctx.fillText(branchName, branch.startX + 160, branch.y - 10);
      });
      
      // Draw commits
      Object.values(branches).forEach(branch => {
        branch.commits.forEach(commit => {
          const y = branch.y;
          
          // Commit dot
          ctx.fillStyle = branch.color;
          ctx.beginPath();
          ctx.arc(commit.x, y, commit.size, 0, Math.PI * 2);
          ctx.fill();
          
          // Hover detection
          const mouseX = (mousePos.x - offsetX) / scale;
          const mouseY = (mousePos.y - offsetY) / scale;
          const dist = Math.sqrt(Math.pow(mouseX - commit.x, 2) + Math.pow(mouseY - y, 2));
          
          if (dist < commit.size + 5) {
            // Highlight
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(commit.x, y, commit.size + 4, 0, Math.PI * 2);
            ctx.stroke();
            
            // Show info
            showInfo(commit, branch);
          }
        });
      });
      
      ctx.restore();
    }
    
    // Mouse handling
    let mousePos = { x: 0, y: 0 };
    
    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      dragStartX = e.clientX - offsetX;
      dragStartY = e.clientY - offsetY;
    });
    
    canvas.addEventListener('mousemove', (e) => {
      mousePos = { x: e.clientX, y: e.clientY };
      
      if (isDragging) {
        offsetX = e.clientX - dragStartX;
        offsetY = e.clientY - dragStartY;
      }
      
      render();
    });
    
    canvas.addEventListener('mouseup', () => {
      isDragging = false;
    });
    
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.9 : 1.1;
      scale *= delta;
      scale = Math.max(0.1, Math.min(scale, 5));
      render();
    });
    
    // Info panel
    function showInfo(commit, branch) {
      infoTitle.textContent = commit.branch;
      infoContent.innerHTML = `
        <div class="info-row">
          <span class="info-label">Message:</span>
          <span class="info-value">${commit.message}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Author:</span>
          <span class="info-value">${branchData.users[commit.author]?.name || commit.author}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Commits:</span>
          <span class="info-value">${branch.commits.length}</span>
        </div>
      `;
      infoPanel.classList.add('visible');
    }
    
    canvas.addEventListener('mouseleave', () => {
      infoPanel.classList.remove('visible');
    });
    
    // Controls
    function zoomIn() {
      scale *= 1.2;
      scale = Math.min(scale, 5);
      render();
    }
    
    function zoomOut() {
      scale *= 0.8;
      scale = Math.max(scale, 0.1);
      render();
    }
    
    function resetView() {
      scale = 1;
      offsetX = 0;
      offsetY = 0;
      render();
    }
  </script>
</body>
</html>
